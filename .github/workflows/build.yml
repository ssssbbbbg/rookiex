name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "== runner =="
          uname -a
          java -version 2>&1
          echo "== 磁盘 =="
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 检查密钥
        run: |
          if [ -f keystore/rookiex.jks ]; then
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/rookiex.jks" >> "$GITHUB_ENV"
            echo "密钥存在: $(stat -c%s keystore/rookiex.jks) bytes"
          else
            echo "::warning::keystore/rookiex.jks 缺失，产物不签名"
          fi

      - name: 构建并签名
        env:
          KEYSTORE_PASSWORD: rain123456
          KEY_ALIAS: rookiex
          KEY_PASSWORD: rain123456
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 校验签名
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo ""
            echo "### 签名校验"
            "$BT/apksigner" verify --verbose "$APK" 2>&1 | head -20
            echo ""
            echo "### 证书"
            "$BT/apksigner" verify --print-certs "$APK" 2>&1 | head -8
          } | tee -a build.log

      - name: 构建摘要
        if: always()
        run: |
          {
            echo ""
            echo "## 构建结果"
            echo "提交: ${{ github.sha }}"
            echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo '### 产物'
            find app/build/outputs -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "无 APK 产出"
          } | tee -a build.log

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 90

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RookieX-signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
